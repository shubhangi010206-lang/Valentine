<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be My Valentine?</title>

<style>
  body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background: linear-gradient(180deg,#ffeff6,#ffffff);
    overflow:hidden;
  }

  .card{
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    padding:28px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
    width:min(92vw,520px);
    position:relative;
    z-index:2;
  }

  h1{margin:0;font-size:32px}
  p{opacity:.8;margin:10px 0}

  #pleaText{
    min-height:26px;
    font-weight:700;
    color:#c10052;
    font-size:17px;
    margin-bottom:14px;
    animation:bounce .4s ease;
  }

  @keyframes bounce{
    0%{transform:scale(.8)}
    60%{transform:scale(1.15)}
    100%{transform:scale(1)}
  }

  button{
    border:none;
    border-radius:999px;
    padding:14px 26px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
    user-select:none;
  }

  #yes{
    background: linear-gradient(135deg,#ff4d88,#ff77a8);
    color:white;
    transition:transform .2s;
  }

  #no{
    position:fixed;
    background:white;
    border:1px solid rgba(0,0,0,.1);
    padding-left:48px;
    z-index:5;
  }

  .wing{
    position:absolute;
    width:18px;
    top:50%;
    transform:translateY(-50%);
  }
  .left{left:12px}
  .right{left:30px;transform:translateY(-50%) scaleX(-1)}

  .message{
    display:none;
    margin-top:14px;
    font-size:19px;
    font-weight:900;
    color:#b1004a;
  }

  .burst{
    position:fixed;
    width:12px;
    height:12px;
    pointer-events:none;
    background-size:contain;
    background-repeat:no-repeat;
    z-index:999;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? 💘</h1>
  <p>Think carefully 😌</p>

  <div id="pleaText"></div>

  <button id="yes">Yes</button>
  <div class="message" id="msg">
    Love you honey, see you on 14th Feb ❤️
  </div>
</div>

<button id="no">
  <svg class="wing left" viewBox="0 0 24 16"><path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#fff" stroke="#ccc"/></svg>
  <svg class="wing right" viewBox="0 0 24 16"><path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#fff" stroke="#ccc"/></svg>
  No
</button>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const pleaText = document.getElementById("pleaText");
  const msg = document.getElementById("msg");

  const pleas = [
    "I will buy you a chocolate 🍫",
    "I will buy you a teddy 🧸",
    "I will take you to a movie 🎬",
    "🥺",
    "Prettyyyy pleaseeee......"
  ];

  let pleaIndex = 0;
  let yesScale = 1;
  let audioCtx;

  function playFlySound(){
    audioCtx ||= new (window.AudioContext||webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type="triangle";
    o.frequency.value=700;
    g.gain.value=.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+.12);
  }

  function typeText(text){
    pleaText.textContent="";
    let i=0;
    const interval=setInterval(()=>{
      pleaText.textContent+=text[i++];
      if(i>=text.length) clearInterval(interval);
    },35);
  }

  function showPlea(){
    pleaText.style.animation="none";
    pleaText.offsetHeight;
    pleaText.style.animation="bounce .4s ease";
    typeText(pleas[Math.min(pleaIndex,pleas.length-1)]);
    pleaIndex++;
  }

  function moveNo(){
    const x=Math.random()*(innerWidth-noBtn.offsetWidth-20)+10;
    const y=Math.random()*(innerHeight-noBtn.offsetHeight-20)+10;
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";

    yesScale=Math.min(yesScale+.18,2.8);
    yesBtn.style.transform=`scale(${yesScale})`;

    playFlySound();
    showPlea();
  }

  ["mouseenter","pointerdown","touchstart","focus"].forEach(e=>{
    noBtn.addEventListener(e,ev=>{
      ev.preventDefault();
      moveNo();
    },{passive:false});
  });

  function heartBurst(cx,cy){
    for(let i=0;i<24;i++){
      const h=document.createElement("div");
      h.className="burst";
      h.style.backgroundImage=`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff4d88'><path d='M12 21s-7-4.6-9.4-8.9C.5 8.3 2.2 5 5.7 5c2 0 3.4 1.1 4.3 2.2C11 6.1 12.4 5 14.3 5c3.5 0 5.2 3.3 3.1 7.1C19 16.4 12 21 12 21z'/></svg>")`;
      document.body.appendChild(h);
      const a=Math.random()*Math.PI*2;
      const d=80+Math.random()*120;
      const x=Math.cos(a)*d;
      const y=Math.sin(a)*d;
      h.style.left=cx+"px";
      h.style.top=cy+"px";
      h.animate([
        {transform:"translate(-50%,-50%)",opacity:1},
        {transform:`translate(${x}px,${y}px)`,opacity:0}
      ],{duration:800,easing:"ease-out"});
      setTimeout(()=>h.remove(),800);
    }
  }

  yesBtn.onclick=e=>{
    const r=yesBtn.getBoundingClientRect();
    heartBurst(r.left+r.width/2,r.top+r.height/2);
    msg.style.display="block";
    yesBtn.textContent="Yay 💖";
    noBtn.style.display="none";
  };

  // initial No position
  moveNo();
</script>

</body>
</html>
