<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#ffeff6;
      --bg2:#ffe3ee;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --pink:#ff4d88;
      --pink2:#ff77a8;
      --shadow: 0 20px 60px rgba(0,0,0,.12);
      --deep:#b1004a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 20%, var(--bg2), transparent 60%),
                  radial-gradient(1000px 700px at 80% 30%, #ffd1e3, transparent 55%),
                  linear-gradient(180deg, var(--bg1), #fff);
      overflow:hidden;
      color:var(--text);
    }

    /* floating background hearts */
    .heart{
      position:absolute;
      width:14px; height:14px;
      transform: rotate(45deg);
      opacity:.18;
      animation: floatUp linear infinite;
      background: var(--pink);
      border-radius: 2px;
      pointer-events:none;
    }
    .heart:before, .heart:after{
      content:"";
      position:absolute;
      width:14px; height:14px;
      background: inherit;
      border-radius: 50%;
    }
    .heart:before{ left:-7px; top:0; }
    .heart:after{ left:0; top:-7px; }

    @keyframes floatUp{
      from{ transform: translateY(120vh) rotate(45deg); }
      to{ transform: translateY(-20vh) rotate(45deg); }
    }

    .card{
      width:min(680px, 92vw);
      padding:34px 26px 26px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align:center;
      position:relative;
      z-index:2;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: .2px;
    }

    /* pink “think carefully” pill */
    .hintPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin: 6px auto 16px;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 850;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      box-shadow: 0 12px 24px rgba(255, 77, 136, .25);
    }

    /* plea text (typewriter) */
    #pleaText{
      min-height: 28px;
      margin: 0 0 18px;
      font-weight: 850;
      font-size: 18px;
      color: var(--deep);
      animation: bounce .4s ease;
    }
    @keyframes bounce{
      0%{transform:scale(.88)}
      60%{transform:scale(1.12)}
      100%{transform:scale(1)}
    }

    .btnRow{
      display:flex;
      gap:14px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-top: 6px;
    }

    button{
      border:none;
      cursor:pointer;
      padding: 16px 22px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 12px 24px rgba(0,0,0,.14);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-width: 160px; /* keep yes/no same size */
    }

    #yes{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      transform: scale(1);
      position:relative;
      z-index:3;
    }
    #yes:hover{ transform: scale(1.05); }

    /* START: No sits beside Yes (relative), then JS turns it fixed when it flies */
    #no{
      background: #ffffff;
      color:#333;
      position:relative;                 /* ← side-by-side at start */
      border: 1px solid rgba(0,0,0,.10);
      padding-left: 52px;                /* space for wings */
      padding-right: 26px;
      z-index:3;
    }

    /* cute wings */
    #no .wing{
      position:absolute;
      width:18px;
      height:12px;
      top:50%;
      transform: translateY(-50%);
      opacity:.95;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    }
    #no .wing.left{ left:14px; transform: translateY(-50%) rotate(-10deg); }
    #no .wing.right{ left:30px; transform: translateY(-50%) rotate(10deg) scaleX(-1); }

    .message{
      margin-top: 14px;
      font-size: 19px;
      font-weight: 950;
      color: var(--deep);
      display:none;
    }

    /* burst particles */
    .burst{
      position:fixed;
      left:0; top:0;
      width:12px; height:12px;
      pointer-events:none;
      z-index:999;
      will-change: transform, opacity;
      background-size: contain;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

  <script>
    // create floating hearts
    const heartCount = 18;
    for(let i=0;i<heartCount;i++){
      const h = document.createElement("div");
      h.className = "heart";
      const size = 10 + Math.random()*16;
      h.style.width = size+"px";
      h.style.height = size+"px";
      h.style.left = (Math.random()*100)+"vw";
      h.style.animationDuration = (6 + Math.random()*8)+"s";
      h.style.animationDelay = (-Math.random()*10)+"s";
      h.style.opacity = (0.10 + Math.random()*0.18).toFixed(2);
      document.body.appendChild(h);
    }
  </script>

  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <div class="hintPill">Think carefully 😌</div>

    <div id="pleaText"></div>

    <!-- YES + NO side-by-side at start -->
    <div class="btnRow">
      <button id="yes" aria-label="Yes">Yes</button>

      <button id="no" aria-label="No">
        <svg class="wing left" viewBox="0 0 24 16" fill="none">
          <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#ffffff" stroke="rgba(0,0,0,.18)"/>
        </svg>
        <svg class="wing right" viewBox="0 0 24 16" fill="none">
          <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#ffffff" stroke="rgba(0,0,0,.18)"/>
        </svg>
        No
      </button>
    </div>

    <div class="message" id="msg">Love you honey, see you on 14th Feb ❤️</div>
  </div>

  <script>
    // ---------- Sound (generated beep so no file needed) ----------
    let audioCtx = null;
    function playFlySound(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();

        o.type = "triangle";
        o.frequency.setValueAtTime(640, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.08);

        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);

        o.connect(g); g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.14);
      }catch(e){}
    }

    // ---------- Plea messages with typewriter ----------
    const pleaMessages = [
      "I will buy you a chocolate 🍫",
      "I will buy you a teddy 🧸",
      "I will take you to a movie 🎬",
      "🥺",
      "pretty please……"
    ];
    let pleaIndex = 0;
    const pleaText = document.getElementById("pleaText");

    let typingTimer = null;
    function typeText(text){
      if(typingTimer) clearInterval(typingTimer);
      pleaText.textContent = "";
      let i = 0;
      typingTimer = setInterval(() => {
        pleaText.textContent += text[i++];
        if(i >= text.length){
          clearInterval(typingTimer);
          typingTimer = null;
        }
      }, 32);
    }

    function showNextPlea(){
      // restart bounce
      pleaText.style.animation = "none";
      void pleaText.offsetWidth;
      pleaText.style.animation = "bounce .4s ease";

      const msg = pleaMessages[Math.min(pleaIndex, pleaMessages.length - 1)];
      typeText(msg);
      pleaIndex++;
    }

    // ---------- Buttons logic ----------
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");

    let yesScale = 1;
    let noHasFlownYet = false;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoButton(){
      // On first escape, detach from row and start flying around screen
      if(!noHasFlownYet){
        noHasFlownYet = true;
        noBtn.style.position = "fixed";
        noBtn.style.zIndex = "9999";
        noBtn.style.transform = "translate(0,0)";
      }

      const padding = 12;

      // accurate sizing (mobile-safe)
      const rect = noBtn.getBoundingClientRect();
      const bw = rect.width;
      const bh = rect.height;

      // clamp range so it never goes off-screen
      const maxX = Math.max(padding, window.innerWidth  - bw - padding);
      const maxY = Math.max(padding, window.innerHeight - bh - padding);

      const x = padding + Math.random() * (maxX - padding);
      const y = padding + Math.random() * (maxY - padding);

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";

      // grow YES
      yesScale = clamp(yesScale + 0.16, 1, 2.8);
      yesBtn.style.transform = `scale(${yesScale})`;
      yesBtn.style.boxShadow = `0 14px 26px rgba(255, 77, 136, ${clamp(0.18 + yesScale*0.08, 0.18, 0.48)})`;

      playFlySound();
      showNextPlea();
    }

    // Bulletproof: No escapes on ANY attempt (works on iPhone/Android + laptops)
    function escapeNo(e){
      e.preventDefault();
      moveNoButton();
    }
    noBtn.addEventListener("pointerenter", escapeNo);
    noBtn.addEventListener("pointerdown", escapeNo);
    noBtn.addEventListener("click", escapeNo);

    // keep it visible after resize/rotation
    window.addEventListener("resize", () => {
      if(noHasFlownYet) moveNoButton();
    });

    // ---------- Heart explosion on YES ----------
    function burstHearts(cx, cy){
      const count = 26;
      for(let i=0;i<count;i++){
        const p = document.createElement("div");
        p.className = "burst";

        const size = 10 + Math.random()*14;
        p.style.width = size+"px";
        p.style.height = size+"px";
        p.style.left = cx + "px";
        p.style.top = cy + "px";
        p.style.transform = "translate(-50%,-50%)";
        p.style.opacity = "1";

        p.style.backgroundImage =
          "url('data:image/svg+xml;utf8," +
          encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#ff4d88"><path d="M12 21s-7.2-4.7-9.6-9.1C.4 8.3 2.1 5 5.6 5c2 0 3.4 1.1 4.4 2.3C11 6.1 12.4 5 14.4 5 17.9 5 19.6 8.3 21.6 11.9 19.2 16.3 12 21 12 21z"/></svg>`) +
          "')";
        p.style.backgroundSize = "contain";
        p.style.backgroundRepeat = "no-repeat";

        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random()*140;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        const rotate = (Math.random()*240 - 120);
        const duration = 700 + Math.random()*400;

        const start = performance.now();

        function animate(t){
          const k = clamp((t - start)/duration, 0, 1);
          const ease = 1 - Math.pow(1 - k, 3);

          const x = cx + dx * ease;
          const y = cy + dy * ease + (k*k*60);

          p.style.left = x + "px";
          p.style.top = y + "px";
          p.style.opacity = String(1 - k);
          p.style.transform = `translate(-50%,-50%) rotate(${rotate*ease}deg) scale(${1 - k*0.15})`;

          if(k < 1) requestAnimationFrame(animate);
          else p.remove();
        }
        requestAnimationFrame(animate);
      }
    }

    yesBtn.addEventListener("click", () => {
      const r = yesBtn.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;

      burstHearts(cx, cy);

      msg.style.display = "block";
      yesBtn.disabled = true;
      noBtn.disabled = true;

      yesBtn.style.filter = "brightness(1.05)";
      yesBtn.textContent = "Yay! 💖";
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
