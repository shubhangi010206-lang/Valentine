<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#ffeff6;
      --bg2:#ffe3ee;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --pink:#ff4d88;
      --pink2:#ff77a8;
      --shadow: 0 20px 60px rgba(0,0,0,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 20%, var(--bg2), transparent 60%),
                  radial-gradient(1000px 700px at 80% 30%, #ffd1e3, transparent 55%),
                  linear-gradient(180deg, var(--bg1), #fff);
      overflow:hidden;
      color:var(--text);
    }

    /* floating hearts */
    .heart{
      position:absolute;
      width:14px; height:14px;
      transform: rotate(45deg);
      opacity:.18;
      animation: floatUp linear infinite;
      background: var(--pink);
      border-radius: 2px;
    }
    .heart:before, .heart:after{
      content:"";
      position:absolute;
      width:14px; height:14px;
      background: inherit;
      border-radius: 50%;
    }
    .heart:before{ left:-7px; top:0; }
    .heart:after{ left:0; top:-7px; }

    @keyframes floatUp{
      from{ transform: translateY(120vh) rotate(45deg); }
      to{ transform: translateY(-20vh) rotate(45deg); }
    }

    .card{
      width:min(560px, 92vw);
      padding:28px 24px 22px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align:center;
      position:relative;
      z-index:2;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(26px, 3.5vw, 36px);
      letter-spacing: .2px;
    }
    p{
      margin:0 0 18px;
      opacity:.85;
      font-size: 15px;
    }

    .btnRow{
      display:flex;
      gap:14px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-top: 6px;
    }

    button{
      border:none;
      cursor:pointer;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    #yes{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      transform: scale(1);
    }
    #yes:hover{ transform: scale(1.05); }

    /* No button becomes absolute so it can fly around */
    #no{
      background: #ffffff;
      color:#333;
      position:absolute;
      left:50%;
      top: 62%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(0,0,0,.08);
      padding-left: 50px; /* space for wings */
      padding-right: 26px;
    }

    /* cute wings */
    #no .wing{
      position:absolute;
      width:18px;
      height:12px;
      top:50%;
      transform: translateY(-50%);
      opacity:.95;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    }
    #no .wing.left{ left:14px; transform: translateY(-50%) rotate(-10deg); }
    #no .wing.right{ left:30px; transform: translateY(-50%) rotate(10deg) scaleX(-1); }

    /* little wiggle when it moves */
    .fly{
      animation: wiggle .22s ease-in-out 2;
    }
    @keyframes wiggle{
      0%{ transform: translate(-50%, -50%) rotate(0deg); }
      40%{ transform: translate(-50%, -50%) rotate(8deg); }
      70%{ transform: translate(-50%, -50%) rotate(-6deg); }
      100%{ transform: translate(-50%, -50%) rotate(0deg); }
    }

    .message{
      margin-top: 10px;
      font-size: 18px;
      font-weight: 750;
      color: #b1004a;
      display:none;
    }

    /* hide the original row space so only buttons show nicely */
    .btnRowPlaceholder{
      height: 78px; /* keeps layout stable while #no is absolute */
      position:relative;
    }
  </style>
</head>
<body>

  <script>
    // create floating hearts
    const heartCount = 18;
    for(let i=0;i<heartCount;i++){
      const h = document.createElement("div");
      h.className = "heart";
      const size = 10 + Math.random()*16;
      h.style.width = size+"px";
      h.style.height = size+"px";
      h.style.left = (Math.random()*100)+"vw";
      h.style.animationDuration = (6 + Math.random()*8)+"s";
      h.style.animationDelay = (-Math.random()*10)+"s";
      h.style.opacity = (0.10 + Math.random()*0.18).toFixed(2);
      document.body.appendChild(h);
    }
  </script>

  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <!-- placeholder row (Yes sits in normal flow, No flies absolutely) -->
    <div class="btnRowPlaceholder">
      <div class="btnRow">
        <button id="yes" aria-label="Yes">Yes</button>
      </div>

      <button id="no" aria-label="No">
        <svg class="wing left" viewBox="0 0 24 16" fill="none">
          <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#ffffff" stroke="rgba(0,0,0,.18)"/>
        </svg>
        <svg class="wing right" viewBox="0 0 24 16" fill="none">
          <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#ffffff" stroke="rgba(0,0,0,.18)"/>
        </svg>
        No
      </button>
    </div>

    <div class="message" id="msg">Love you honey, see you on 14th Feb ❤️</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const card = document.getElementById("card");

    let yesScale = 1;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoButton(){
      const padding = 14;

      // viewport size
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const rect = noBtn.getBoundingClientRect();
      const bw = rect.width;
      const bh = rect.height;

      // keep it away from edges
      const x = Math.random() * (vw - bw - padding*2) + padding;
      const y = Math.random() * (vh - bh - padding*2) + padding;

      // Set absolute position using left/top in px and remove translate centering
      // We'll use left/top directly.
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "translate(0, 0)";

      noBtn.classList.remove("fly");
      // reflow for restart animation
      void noBtn.offsetWidth;
      noBtn.classList.add("fly");

      // grow YES each escape
      yesScale = clamp(yesScale + 0.15, 1, 2.6);
      yesBtn.style.transform = `scale(${yesScale})`;
      yesBtn.style.boxShadow = `0 14px 26px rgba(255, 77, 136, ${clamp(0.18 + yesScale*0.08, 0.18, 0.45)})`;
    }

    // Start position: center-ish inside card
    function resetNoToCard(){
      const cardRect = card.getBoundingClientRect();
      noBtn.style.left = (cardRect.left + cardRect.width/2 - noBtn.offsetWidth/2) + "px";
      noBtn.style.top = (cardRect.top + cardRect.height*0.62) + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    window.addEventListener("load", () => {
      resetNoToCard();
    });
    window.addEventListener("resize", () => {
      // keep it on screen after resize
      const rect = noBtn.getBoundingClientRect();
      const onScreen =
        rect.left >= 0 && rect.top >= 0 &&
        rect.right <= window.innerWidth &&
        rect.bottom <= window.innerHeight;
      if(!onScreen) moveNoButton();
    });

    // Make it fly on hover and on tap (mobile)
    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, {passive:false});

    yesBtn.addEventListener("click", () => {
      msg.style.display = "block";
      // disable buttons after success
      yesBtn.disabled = true;
      noBtn.disabled = true;

      yesBtn.style.filter = "brightness(1.05)";
      yesBtn.textContent = "Yay! 💖";
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
