<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be My Valentine?</title>

<style>
  :root{
    --pink:#ff4d88;
    --pink2:#ff77a8;
    --deep:#b1004a;
  }

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background:
      radial-gradient(1200px 800px at 20% 20%, #ffd1e3, transparent 60%),
      radial-gradient(1100px 800px at 80% 30%, #ffc0d6, transparent 55%),
      linear-gradient(180deg,#ffeff6,#ffffff);
    overflow:hidden;
  }

  /* Bigger question box */
  .card{
    width:min(94vw, 680px);
    padding:36px 28px 28px;
    border-radius:28px;
    text-align:center;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow:0 24px 70px rgba(0,0,0,.15);
    backdrop-filter: blur(10px);
    position:relative;
    z-index:2;
  }

  h1{
    margin:0 0 14px;
    font-size: clamp(30px, 4vw, 44px);
    letter-spacing:.2px;
  }

  /* “Think carefully” pink pill */
  .hintPill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin: 0 auto 18px;
    padding: 10px 16px;
    border-radius: 999px;
    font-weight:800;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    box-shadow: 0 12px 24px rgba(255, 77, 136, .25);
  }

  /* Plea text */
  #pleaText{
    min-height:30px;
    margin: 0 0 18px;
    font-weight:800;
    color: var(--deep);
    font-size:18px;
    animation:bounce .4s ease;
  }
  @keyframes bounce{
    0%{transform:scale(.85)}
    60%{transform:scale(1.12)}
    100%{transform:scale(1)}
  }

  /* Buttons side-by-side, same size at the start */
  .btnRow{
    display:flex;
    gap:14px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    margin-top: 6px;
  }

  button{
    border:none;
    border-radius:999px;
    padding:16px 22px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 12px 24px rgba(0,0,0,.14);
    user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-width: 160px; /* makes them the same "size" */
  }

  #yes{
    background: linear-gradient(135deg,var(--pink),var(--pink2));
    color:white;
    transition:transform .2s;
    position:relative;
    z-index:3;
  }

  /* No starts normal (next to Yes) */
  #no{
    background:white;
    border:1px solid rgba(0,0,0,.12);
    position:relative;          /* normal flow initially */
    z-index:3;
    padding-left:52px;          /* room for wings */
  }

  /* wings */
  .wing{
    position:absolute;
    width:18px;
    top:50%;
    transform:translateY(-50%);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.10));
  }
  .left{left:12px}
  .right{left:32px;transform:translateY(-50%) scaleX(-1)}

  .message{
    display:none;
    margin-top:18px;
    font-size:20px;
    font-weight:950;
    color: var(--deep);
  }

  .burst{
    position:fixed;
    width:12px;
    height:12px;
    pointer-events:none;
    background-size:contain;
    background-repeat:no-repeat;
    z-index:999;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? 💘</h1>

  <div class="hintPill">Think carefully 😌</div>

  <div id="pleaText"></div>

  <div class="btnRow">
    <button id="yes">Yes</button>

    <button id="no">
      <svg class="wing left" viewBox="0 0 24 16">
        <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#fff" stroke="rgba(0,0,0,.18)"/>
      </svg>
      <svg class="wing right" viewBox="0 0 24 16">
        <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#fff" stroke="rgba(0,0,0,.18)"/>
      </svg>
      No
    </button>
  </div>

  <div class="message" id="msg">Love you honey, see you on 14th Feb ❤️</div>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const pleaText = document.getElementById("pleaText");
  const msg = document.getElementById("msg");

  const pleas = [
    "I will buy you a chocolate 🍫",
    "I will buy you a teddy 🧸",
    "I will take you to a movie 🎬",
    "🥺",
    "pretty please……"
  ];

  let pleaIndex = 0;
  let yesScale = 1;
  let audioCtx = null;
  let noHasFlownYet = false;

  function playFlySound(){
    try{
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(650, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(980, audioCtx.currentTime + 0.08);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.14);
    }catch(e){}
  }

  function typeText(text){
    pleaText.textContent = "";
    let i = 0;
    const t = setInterval(() => {
      pleaText.textContent += text[i++];
      if(i >= text.length) clearInterval(t);
    }, 32);
  }

  function showPlea(){
    pleaText.style.animation = "none";
    pleaText.offsetHeight; // restart animation
    pleaText.style.animation = "bounce .4s ease";
    const pick = pleas[Math.min(pleaIndex, pleas.length - 1)];
    typeText(pick);
    pleaIndex++;
  }

function moveNo(){
  // First time: convert No into a flying button (fixed position)
  if(!noHasFlownYet){
    noHasFlownYet = true;
    noBtn.style.position = "fixed";
    noBtn.style.zIndex = "9999";     // extra-safe: always on top
  }

  const padding = 12;

  // Measure the button each time (more reliable on mobile)
  const bw = noBtn.getBoundingClientRect().width;
  const bh = noBtn.getBoundingClientRect().height;

  // Make sure the random range NEVER becomes negative
  const maxX = Math.max(padding, window.innerWidth  - bw - padding);
  const maxY = Math.max(padding, window.innerHeight - bh - padding);

  const x = padding + Math.random() * (maxX - padding);
  const y = padding + Math.random() * (maxY - padding);

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";

  yesScale = Math.min(yesScale + 0.18, 2.8);
  yesBtn.style.transform = `scale(${yesScale})`;

  playFlySound();
  showPlea();
}


  function heartBurst(cx, cy){
    for(let i=0;i<26;i++){
      const h = document.createElement("div");
      h.className = "burst";
      h.style.backgroundImage =
        `url("data:image/svg+xml;utf8,` +
        `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff4d88'>` +
        `<path d='M12 21s-7-4.6-9.4-8.9C.5 8.3 2.2 5 5.7 5c2 0 3.4 1.1 4.3 2.2C11 6.1 12.4 5 14.3 5c3.5 0 5.2 3.3 3.1 7.1C19 16.4 12 21 12 21z'/>` +
        `</svg>")`;
      document.body.appendChild(h);

      const a = Math.random() * Math.PI * 2;
      const d = 90 + Math.random() * 140;
      const dx = Math.cos(a) * d;
      const dy = Math.sin(a) * d + 50; // slight gravity

      h.style.left = cx + "px";
      h.style.top = cy + "px";

      h.animate(
        [
          { transform:"translate(-50%,-50%) scale(1)", opacity:1 },
          { transform:`translate(${dx}px,${dy}px) scale(.9)`, opacity:0 }
        ],
        { duration: 850, easing:"ease-out" }
      );

      setTimeout(() => h.remove(), 900);
    }
  }

  yesBtn.addEventListener("click", () => {
    const r = yesBtn.getBoundingClientRect();
    heartBurst(r.left + r.width/2, r.top + r.height/2);

    msg.style.display = "block";
    yesBtn.textContent = "Yay 💖";
    yesBtn.disabled = true;
    noBtn.disabled = true;
    noBtn.style.display = "none";
  });
  window.addEventListener("resize", () => {
  if(noHasFlownYet) moveNo();
});

</script>

</body>
</html>
