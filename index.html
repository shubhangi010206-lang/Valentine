<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#ffeff6;
      --bg2:#ffe3ee;
      --card:#ffffffcc;
      --text:#2b2b2b;
      --pink:#ff4d88;
      --pink2:#ff77a8;
      --shadow: 0 20px 60px rgba(0,0,0,.12);
      --deep:#b1004a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 20%, var(--bg2), transparent 60%),
                  radial-gradient(1000px 700px at 80% 30%, #ffd1e3, transparent 55%),
                  linear-gradient(180deg, var(--bg1), #fff);
      overflow:hidden;
      color:var(--text);
    }

    /* floating background hearts */
    .heart{
      position:absolute;
      width:14px; height:14px;
      transform: rotate(45deg);
      opacity:.18;
      animation: floatUp linear infinite;
      background: var(--pink);
      border-radius: 2px;
      pointer-events:none;
    }
    .heart:before, .heart:after{
      content:"";
      position:absolute;
      width:14px; height:14px;
      background: inherit;
      border-radius: 50%;
    }
    .heart:before{ left:-7px; top:0; }
    .heart:after{ left:0; top:-7px; }

    @keyframes floatUp{
      from{ transform: translateY(120vh) rotate(45deg); }
      to{ transform: translateY(-20vh) rotate(45deg); }
    }

    .card{
      width:min(680px, 92vw);
      padding:34px 26px 26px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align:center;
      position:relative;
      z-index:2;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(30px, 4vw, 44px);
      letter-spacing: .2px;
    }

    /* pink “think carefully” pill */
    .hintPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin: 6px auto 16px;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 850;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      box-shadow: 0 12px 24px rgba(255, 77, 136, .25);
    }

    /* plea text (typewriter) */
    #pleaText{
      min-height: 28px;
      margin: 0 0 18px;
      font-weight: 850;
      font-size: 18px;
      color: var(--deep);
      animation: bounce .4s ease;
    }
    @keyframes bounce{
      0%{transform:scale(.88)}
      60%{transform:scale(1.12)}
      100%{transform:scale(1)}
    }

    .btnRow{
      display:flex;
      gap:14px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-top: 6px;
    }

    button{
      border:none;
      cursor:pointer;
      padding: 16px 22px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 12px 24px rgba(0,0,0,.14);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-width: 160px; /* keep yes/no same size */
    }

    #yes{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      transform: scale(1);
      position:relative;
      z-index:3;
    }
    #yes:hover{ transform: scale(1.05); }

    /* START: No sits beside Yes (relative), then JS turns it fixed when it flies */
    #no{
      background: #ffffff;
      color:#333;
      position:relative;                 /* ← key: side-by-side at start */
      border: 1px solid rgba(0,0,0,.10);
      padding-left: 52px;                /* space for wings */
      padding-right: 26px;
      z-index:3;
    }

    /* cute wings */
    #no .wing{
      position:absolute;
      width:18px;
      height:12px;
      top:50%;
      transform: translateY(-50%);
      opacity:.95;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    }
    #no .wing.left{ left:14px; transform: translateY(-50%) rotate(-10deg); }
    #no .wing.right{ left:30px; transform: translateY(-50%) rotate(10deg) scaleX(-1); }

    .message{
      margin-top: 14px;
      font-size: 19px;
      font-weight: 950;
      color: var(--deep);
      display:none;
    }

    /* burst particles */
    .burst{
      position:fixed;
      left:0; top:0;
      width:12px; height:12px;
      pointer-events:none;
      z-index:999;
      will-change: transform, opacity;
      background-size: contain;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

  <script>
    // create floating hearts
    const heartCount = 18;
    for(let i=0;i<heartCount;i++){
      const h = document.createElement("div");
      h.className = "heart";
      const size = 10 + Math.random()*16;
      h.style.width = size+"px";
      h.style.height = size+"px";
      h.style.left = (Math.random()*100)+"vw";
      h.style.animationDuration = (6 + Math.random()*8)+"s";
      h.style.animationDelay = (-Math.random()*10)+"s";
      h.style.opacity = (0.10 + Math.random()*0.18).toFixed(2);
      document.body.appendChild(h);
    }
  </script>

  <div class="card" id="card">
    <h1>Will you be my Valentine? 💘</h1>
    <div class="hintPill">Think carefully 😌</div>

    <div id="pleaText"></div>

    <!-- YES + NO side-by-side at start -->
    <div class="btnRow">
      <button id="yes" aria-label="Yes">Yes</button>

      <button id="no" aria-label="No">
        <svg class="wing left" viewBox="0 0 24 16" fill="none">
          <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#ffffff" stroke="rgba(0,0,0,.18)"/>
        </svg>
        <svg class="wing right" viewBox="0 0 24 16" fill="none">
          <path d="M2 10c4-6 9-8 14-8-2 3-4 6-4 10-3-2-6-2-10-2Z" fill="#ffffff" stroke="rgba(0,0,0,.18)"/>
        </svg>
        No
      </button>
    </div>

    <div class="message" id="msg">Love you honey, see you on 14th Feb ❤️</div>
  </div>

    let audioCtx = null;
    function playFlySound(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();

        o.type = "triangle";
        o.frequency.setValueAtTime(640, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.08);

        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);

        o.start();
        o.stop(ctx.currentTime + 0.14);
      }catch(e){}
    }
